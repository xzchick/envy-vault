[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-vault"
version = "0.1.0"
description = "ENVY Vault: authenticated local file encryption with a native app window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cryptography>=43",
  "PyQt6>=6.7,<7",
]

[project.scripts]
envy-vault = "envy_vault.cli:main"

[project.gui-scripts]
envy-vault-gui = "envy_vault.cli:main"

[tool.setuptools.packages.find]
include = ["envy_vault*"]
